<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Wildroot — 2D Survival (v4.1)</title>
<style>
:root{--san:#b58ae0;--bg:#10150f;--panel:#1a2117;--panel2:#242d20;--line:#3d4a35;--ink:#e9eddb;--dim:#98a688;--accent:#e8b84a;--bad:#d9573f;--good:#7ac45a;--water:#4aa0d8;--hp:#d9473f;--food:#d08a3a;--thirst:#4aa0d8;--energy:#9a7ad8;--stam:#7ac45a;--warm:#e0884a}
*{box-sizing:border-box;margin:0;padding:0;border-radius:0}
html,body{height:100%;overflow:hidden;background:#000;color:var(--ink);font-family:'Trebuchet MS',Verdana,system-ui,sans-serif;user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;left:0;top:0;width:100%;height:100%;display:block;cursor:crosshair}
.hidden{display:none!important}
button{font:inherit;color:var(--ink);background:var(--panel2);border:2px solid var(--line);padding:6px 12px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent);color:#fff}
button:disabled{opacity:.4;cursor:default}
button.primary{background:#3c5a28;border-color:#6aa04a}
button.primary:hover:not(:disabled){background:#4a6e30}
#hud>*{position:fixed;pointer-events:none}
#bars{left:10px;top:10px;width:210px;background:rgba(14,18,12,.78);border:2px solid var(--line);padding:6px 8px}
.bar{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:12px}
.bar span.ic{width:18px;text-align:center}
.bar .tr{flex:1;height:11px;background:#0b0e09;border:1px solid #000;position:relative}
.bar .fl{height:100%;transition:width .15s}
.bar b{width:28px;text-align:right;font-weight:normal;color:var(--dim);font-size:11px}
#status{left:10px;top:176px;display:flex;gap:4px;flex-wrap:wrap;width:210px}
.stt{background:rgba(14,18,12,.85);border:2px solid var(--bad);padding:2px 6px;font-size:12px}
#topright{right:10px;top:10px;text-align:right}
#clock{background:rgba(14,18,12,.78);border:2px solid var(--line);padding:5px 9px;font-size:13px;margin-bottom:6px;display:inline-block}
#mini{display:block;margin-left:auto;border:2px solid var(--line);background:#0a0d08;width:140px;height:140px;image-rendering:pixelated}
#log{left:10px;bottom:96px;font-size:13px;max-width:360px}
#log div{background:rgba(14,18,12,.75);border-left:3px solid var(--accent);padding:3px 8px;margin-top:3px;animation:fadeout 7s forwards}
@keyframes fadeout{0%,80%{opacity:1}100%{opacity:0}}
#prompt{left:50%;bottom:104px;transform:translateX(-50%);background:rgba(14,18,12,.85);border:2px solid var(--accent);padding:5px 12px;font-size:14px;white-space:nowrap}
#hotbar{left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:4px;pointer-events:auto!important}
.slot{width:54px;height:54px;background:rgba(14,18,12,.85);border:2px solid var(--line);position:relative;display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer}
.slot.sel{border-color:var(--accent);box-shadow:0 0 0 2px #000 inset,0 0 8px var(--accent)}
.slot .n{position:absolute;right:2px;bottom:0;font-size:11px;color:#fff;text-shadow:1px 1px 0 #000}
.slot .k{position:absolute;left:3px;top:0;font-size:10px;color:var(--dim)}
.slot .cb{position:absolute;left:0;right:0;bottom:0;height:3px}
.slot .du{position:absolute;left:3px;right:3px;bottom:3px;height:3px;background:#000}
.slot .du i{display:block;height:100%;background:var(--good)}
#quest{right:10px;top:208px;width:230px;background:rgba(14,18,12,.78);border:2px solid var(--line);padding:6px 9px;font-size:12px;line-height:1.35}
#quest h4{color:var(--accent);font-size:12px;margin-bottom:2px}
#menubtns{left:50%;top:10px;transform:translateX(-50%);display:flex;gap:4px;pointer-events:auto!important}
#menubtns button{padding:6px 9px;font-size:13px;background:rgba(14,18,12,.85)}
.screen{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 20%,#27391f 0%,#0d120b 75%);overflow:auto;z-index:50;display:flex;flex-direction:column;align-items:center;padding:22px 14px}
.screen h1{font-size:54px;letter-spacing:8px;color:var(--accent);text-shadow:4px 4px 0 #000;font-family:Georgia,serif}
.screen h1 small{font-size:14px;letter-spacing:2px;color:var(--good);display:block;text-align:center;margin-top:-4px}
.screen h3{margin:16px 0 8px;color:var(--dim);letter-spacing:2px;font-size:13px;text-transform:uppercase}
.cards{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:1000px}
.card{width:200px;background:var(--panel);border:2px solid var(--line);padding:10px;cursor:pointer;font-size:12px;line-height:1.35;color:var(--dim)}
.card:hover{border-color:#8aa66a}
.card.on{border-color:var(--accent);background:#2a331f;color:var(--ink)}
.card b{display:block;color:var(--ink);font-size:15px;margin-bottom:3px}
.card canvas{display:block;margin:0 auto 6px;image-rendering:pixelated;background:#2e4a25;border:1px solid #000}
.card .perk{color:var(--good);margin-top:4px}
.row{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap;justify-content:center}
input[type=text],input[type=number]{background:#0b0e09;color:var(--ink);border:2px solid var(--line);padding:6px 8px;font:inherit;width:150px}
#panel{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:40;display:flex;align-items:center;justify-content:center;padding:10px}
#pbox{background:var(--panel);border:3px solid var(--line);width:min(980px,100%);height:min(640px,100%);display:flex;flex-direction:column}
#phead{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:2px solid var(--line);background:var(--panel2);flex-wrap:wrap}
#phead h2{font-size:17px;color:var(--accent);margin-right:10px;font-family:Georgia,serif}
#phead .tab{padding:4px 9px;font-size:12px}
#phead .tab.on{background:#3c5a28;border-color:var(--accent)}
#phead .x{margin-left:auto}
#pbody{flex:1;overflow:hidden;display:flex;min-height:0}
.pl{flex:1.3;overflow:auto;padding:10px;min-width:0}
.pr{flex:1;overflow:auto;padding:10px;border-left:2px solid var(--line);background:#161c13;font-size:13px;line-height:1.45;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:4px}
.it{aspect-ratio:1;background:#10150e;border:2px solid var(--line);position:relative;display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer}
.it:hover{border-color:#8aa66a}.it.sel{border-color:var(--accent)}
.it .n{position:absolute;right:2px;bottom:0;font-size:11px;color:#fff;text-shadow:1px 1px 0 #000}
.it .cb{position:absolute;left:0;right:0;bottom:0;height:3px}
.rl{display:flex;align-items:center;gap:8px;padding:5px 7px;border:2px solid transparent;border-bottom-color:#232c1f;cursor:pointer;font-size:13px}
.rl:hover{background:#202a1c}.rl.sel{border-color:var(--accent);background:#262f21}
.rl.no{color:#6d7a5f}.rl .ic{font-size:20px;width:26px;text-align:center}
.need{display:inline-block;margin:2px 4px 2px 0;padding:2px 6px;border:1px solid var(--line);font-size:12px}
.need.ok{border-color:var(--good);color:#cfeab8}.need.bad{border-color:var(--bad);color:#f0b0a0}
.ent{border:2px solid var(--line);padding:6px;background:#10150e;font-size:12px;line-height:1.35;display:flex;gap:8px;align-items:flex-start}
.ent.unk{opacity:.45}.ent .ic{font-size:26px}
.ent b{color:var(--ink)}.tag{display:inline-block;padding:0 5px;margin-left:4px;font-size:11px;border:1px solid}
.tag.e{color:var(--good);border-color:var(--good)}.tag.p{color:var(--bad);border-color:var(--bad)}.tag.m{color:#6ac8e8;border-color:#6ac8e8}.tag.u{color:var(--dim);border-color:var(--dim)}
.eg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.pbar{height:12px;background:#0b0e09;border:1px solid #000;margin:4px 0 10px}.pbar i{display:block;height:100%;background:var(--good)}
.h3{color:var(--accent);margin:10px 0 4px;font-size:13px;letter-spacing:1px}
.q{padding:3px 0}.q.done{color:var(--good);text-decoration:line-through}.q.cur{color:var(--accent)}
#death{z-index:60;background:rgba(40,0,0,.9);justify-content:center;text-align:center}
#touch{position:fixed;inset:0;pointer-events:none;z-index:20}
#touch .tb{position:fixed;pointer-events:auto;width:64px;height:64px;border:2px solid rgba(255,255,255,.4);background:rgba(0,0,0,.35);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center}
#joy{position:fixed;left:24px;bottom:96px;width:130px;height:130px;border:2px solid rgba(255,255,255,.3);background:rgba(0,0,0,.25);pointer-events:auto;border-radius:0}
#joy i{position:absolute;left:41px;top:41px;width:48px;height:48px;background:rgba(255,255,255,.35);border-radius:0}
@media(max-width:760px){.screen h1{font-size:34px}#pbody{flex-direction:column}.pr{border-left:0;border-top:2px solid var(--line)}#quest{display:none}.slot{width:36px;height:36px;font-size:18px}}
</style></head><body>

function placeRuins(){
 G.ruins=[];let tries=0;const want=9;
 while(G.ruins.length<want&&tries++<3000){
  const cx=6+Math.floor(rnd()*(W-12)),cy=6+Math.floor(rnd()*(H-12));
  if(Math.hypot(cx-spawnPt.x,cy-spawnPt.y)<22)continue;
  if(G.ruins.some(r=>Math.hypot(r.x-cx,r.y-cy)<24))continue;
  let ok=true;for(let j=-2;j<=2&&ok;j++)for(let i=-2;i<=2;i++){const k=(cy+j)*W+cx+i;if(![3,4,5,6,8].includes(tiles[k])||structAt[k]||(Math.abs(i)<2&&Math.abs(j)<2&&objAt[k])||(Math.abs(i)===2||Math.abs(j)===2)&&objAt[k]&&objs[objAt[k]-1].k==='tree'){ok=false;break}}
  if(!ok)continue;
  const r={x:cx,y:cy,found:0};G.ruins.push(r);

 if(it.cat==='feed'){const an=animalAhead(2.4);if(an&&an.tame){inv[id]--;an.fed=DAY*1.5;floatTxt(an.x,an.y-.6,'♥','#ff6a8a')}else toast('Hay feeds tame animals. Aim at one, or fill a trough.');return}

 if(a){let d=(it.dmg||2)*P.ch.st.dmg*(.85+rnd()*.3);if(rnd()<.1)d*=1.8;hitAnimal(a,d,id);useDur(id);return}

function hudUpdate(){
 const v={hp:P.hp,warm:P.warm,hunger:P.hunger,thirst:P.thirst,energy:P.energy,stam:P.stam,san:B().san};
 for(const k in v){$('b_'+k).style.width=clamp(v[k],0,100)+'%';$('v_'+k).textContent=Math.round(v[k])}
 $('status').innerHTML=P.st.map(s=>`<div class="stt">${stLabel(s)}</div>`).join('')+v10Chips()+(P.exh?'<div class="stt" style="border-color:#c8a030">Exhausted</div>':'')+(G.settings.needs&&P.warm<30?'<div class="stt" style="border-color:#6ac8e8">🥶 Freezing</div>':'')+(G.settings.needs&&P.warm>92?'<div class="stt" style="border-color:#e86a3a">🥵 Overheating</div>':'')+(G.sleeping?'<div class="stt" style="border-color:#8a8ae8">💤 Sleeping</div>':'');
 const h=hourNow();$('clock').innerHTML=wxIcon()+' Day '+dayNum()+' · '+SEASONS[season()]+' · '+fmtClock()+(G.settings.timeScale>1?' · ×'+G.settings.timeScale:'');
 const sl=$('hotbar').children;
 for(let i=0;i<10;i++){const id=i<9?G.hot[i]:null,el=sl[i],it=id&&inv[id]>0?ITEMS[id]:null;
  el.className='slot'+(i===G.sel?' sel':'');
  let dur='';if(it&&it.dur&&G.dur[id]!=null)dur=`<div class="du"><i style="width:${clamp(G.dur[id]/it.dur*100,0,100)}%"></i></div>`;
  el.innerHTML=`<span class="k">${i===9?0:i+1}</span>`+(i===9?'✋':'')+(it?`${it.icon}<span class="n">${inv[id]>1?inv[id]:''}</span><div class="cb" style="background:${it.col}"></div>${dur}`:'')+(it&&G.armor[it.armor]===id?'<span class="k" style="left:auto;right:3px;color:#7ac45a">●</span>':'')}
 const pr=$('prompt'),si=selItem();let t='';
 if(focus&&!P.dead)t='[E] '+focus.label;

function updBody(dt){
 const b=B(),needs=G.settings.needs;if(P.dead)return;

 b.noiseB=Math.max(0,b.noiseB-dt);
 if(b.sneak&&(P.run||!P.moving&&false))b.sneak=0;
 // sleep debt
 if(G.sleeping)b.debt=Math.max(0,b.debt-dt*3);else if(b.blackout<=0)b.debt+=dt;
 // ---- wet
 const rainOn=G.raining&&(G.rainI||0)>.3&&!sh&&!cave;
 if(rainOn)b.wet+=(G.storm?9:5)*G.rainI*dt;
 if(tile===1)b.wet+=10*dt;
 let dry=1+(nearFireV10(5)?7:0)+(sh?2:0)+(n<.3&&!G.raining?.6:0)+(season()===1?1:0);
 if(!rainOn)b.wet-=dry*dt;
 b.wet=clamp(b.wet,0,100);
 // ---- hygiene
 b.dirt+=(tile===6?.05:.012)*dt*(P.moving?1:.4);
 if(tile===1){b.dirt-=3.2*dt;if(b.dirt<30&&!b.washed&&b.hist.dirty){b.washed=1;toast('Wading in the shallows rinses the grime off.')}}
 if(rainOn)b.dirt-=.4*dt;
 if(b.dirt>40)b.hist.dirty=1;
 b.dirt=clamp(b.dirt,0,100);
 if(b.dirt>60){b.flyT-=dt;if(b.flyT<=0){b.flyT=rr(.4,1.2);parts.push({x:P.x+rr(-.6,.6),y:P.y+rr(-.9,-.2),vx:rr(-1,1),vy:rr(-1,0),life:.7,col:'#222',s:2})}}
 // ---- nutrition decay
 if(needs){const k=dt*(1-.02*skill('survival'))*(P.run?1.2:1);b.nut[0]-=.060*k;b.nut[1]-=.034*k;b.nut[2]-=.040*k;b.nut[3]-=.050*k;if(hasSt('dysentery'))for(let i=0;i<4;i++)b.nut[i]-=.04*dt}
 for(let i=0;i<4;i++)b.nut[i]=clamp(b.nut[i],0,100);
 if(needs&&b.nut[3]<12&&P.hp<100&&P.hp>8&&!G.sleeping){P.hp-=0;/* vitamin lack halts passive healing, see below */}
 // ---- sanity
 let dS=0;
 if(n>.5&&!lit&&!P.torchOn&&!sh&&b.san>28)dS-=.035*n;if(cave&&!P.torchOn&&!lit&&b.san>28)dS-=.05;if(b.san<=60&&dS>=-.001&&!G.sleeping)dS+=.012;
 if(P.hunger<20)dS-=.04;if(P.thirst<20)dS-=.04;if(P.warm<30)dS-=.04;if(P.hp<30)dS-=.04;
 if(hasSt('fever'))dS-=.05;if(b.debt>DAY*.8)dS-=.05;if(b.wet>70)dS-=.015;if(b.dirt>80)dS-=.015;if(G.raining&&G.storm)dS-=.03;
 if(lit)dS+=.15;if(sh)dS+=.04;if(G.sleeping)dS+=.3;if(n<.2&&!cave)dS+=.07;if(P.hunger>60&&P.thirst>60)dS+=.015;
 if(!needs)dS*=.2;
 b.san=clamp(b.san+dS*dt*(dS<0?1-.025*skill('survival'):1),0,100);
 if(b.san<50&&!G.sleeping){b.whisperT-=dt;if(b.whisperT<=0){b.whisperT=rr(14,34)*(b.san/50+.4);whisper()}}
 if(b.san<35&&!G.sleeping){b.hallT-=dt;if(b.hallT<=0){b.hallT=rr(9,22)*(b.san/35+.3);spawnHall()}}
 for(let i=b.hall.length-1;i>=0;i--){const h=b.hall[i];h.t+=dt;const dx=P.x-h.x,dy=P.y-h.y,d=Math.hypot(dx,dy)||1;
  h.x+=dx/d*h.sp*dt;h.y+=dy/d*h.sp*dt;
  if(d<1.7||h.t>h.life){if(d<1.7){floatTxt(h.x,h.y-.6,'...','#b58ae0');b.san=Math.max(0,b.san-1.5);if(rnd()<.5)sfx('hurt')}b.hall.splice(i,1)}}
 if(b.san<=0&&needs){P.hp-=.12*dt;if(rnd()<dt*.05){P.stam=0;toast('Your hands shake uncontrollably.','bad')}if(P.hp<=0)die()}
 // ---- infection from bleeding
 if(hasSt('bleed'))b.infT+=dt*(1+b.dirt/50)*(hasSt('infect')?0:1);else b.infT=Math.max(0,b.infT-dt*.5);
 if(b.infT>18&&!hasSt('infect')){b.infT=0;addStatus('infect',700,.06);toast('The wound looks hot and red. Rinse it with clean water, then apply a poultice.','bad')}
 const inf=stOf('infect');if(inf){b.infAge+=dt;if(b.infAge>130&&!hasSt('fever')){addStatus('fever',360,.05)}}else b.infAge=0;
 // ---- disease
 if((P.warm<45||(b.wet>55&&ambientTemp()<45))&&needs)b.chill+=dt;else b.chill=Math.max(0,b.chill-dt*.7);
 if(b.chill>45&&!hasSt('cold')&&rnd()<dt*.015*(b.nut[3]<12?2:1)*(1-.03*skill('survival'))*(b.dirt>85?1.5:1)){addStatus('cold',420,0);toast('You are coming down with a cold. Tea and warmth will help.','bad')}
 if(hasSt('cold')){b.sneezeT-=dt;if(b.sneezeT<=0){b.sneezeT=rr(18,45);floatTxt(P.x,P.y-.8,'achoo!','#cfe');b.noiseB=1.5;P.stam=Math.max(0,P.stam-8);sfx('hurt')}if(P.warm>70&&b.wet<20&&rnd()<dt*.004){rmSt('cold');toast('Your cold clears.','good')}}
 if(hasSt('fever')&&needs){P.thirst=Math.max(0,P.thirst-.12*dt)}

 if(hasSt('heat')){P.stam=Math.max(0,P.stam-4*dt);if(P.warm<85&&P.thirst>50)rmSt('heat')}
 // ---- parasites attach
 if(needs){const wade=tile===1||tile===6;
  if(wade&&rnd()<dt*.045*(1+b.dirt/120)*(P.moving?1:.5))attachBug('leech');
  if([4,5,6].includes(tile)&&P.moving&&rnd()<dt*.004*(1+b.dirt/100))attachBug('tick');
  const sl=stOf('leech'),tk=stOf('tick');
  if(sl){sl.age+=dt;P.hp-=.06*sl.n*dt;if(needs)P.hunger=Math.max(0,P.hunger-.03*sl.n*dt);if(sl.age>130){rmSt('leech');toast('The gorged leech drops off.')}}
  if(tk){tk.age+=dt;if(tk.age>90&&!hasSt('fever')&&rnd()<dt*.02){addStatus('fever',360,.05);toast('The tick bite brings on a fever.','bad')}}
 }
 // ---- stamina extras
 if(P.moving&&!G.sleeping){if(tile===1)P.stam=Math.max(0,P.stam-2.5*dt);if(tile===7)P.stam=Math.max(0,P.stam-2*dt);if(P.run&&encMul()<1)P.stam=Math.max(0,P.stam-6*dt)}
 if(b.nut[0]<12)P.stam=Math.max(0,P.stam-.5*dt*(P.moving?1:0));
 if(P.stam<=0&&!P.exh&&P.moving&&needs)P.exh=true;
 // vitamins: no natural regeneration when very low; low fat chills
 if(needs&&b.nut[3]<12&&P.hp>40&&!G.sleeping)P.hp=Math.max(40,P.hp-.0);
 // ---- blackouts
 if(needs&&!G.sleeping&&b.blackout<=0&&(P.energy<=2||b.debt>DAY*1.7)&&rnd()<dt*.08){b.blackout=7;toast('Your vision narrows... you black out!','bad');sfx('hurt')}
 // survival xp trickle
 if(needs&&P.hunger>30&&P.thirst>30&&rnd()<dt*.02)xpGain('survival',1);
}

 if(o&&o.k==='tree'){type='tree';life=rr(11,16)}else if(o){type='plant';life=rr(3,5)}else if(s&&s.k!=='campfire'){type='struct';life=rr(9,13)}else if(cropAtTile(tx,ty)){type='crop';life=rr(5,8)}

function planFlood(){

 for(let j=2;j<H-2;j++)for(let i=2;i<W-2;i++){if(tiles[j*W+i]<=1)front.push([i,j,0])}
 const q=front.filter((_,k)=>k%3===0);// thin the start set
 let layer=q;for(let d=1;d<=3;d++){const next=[];for(const[x,y]of layer){for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,i=ny*W+nx;if(nx<1||ny<1||nx>=W-1||ny>=H-1||seen[i])continue;const t=tiles[i];if(t<2||t===7||t===8)continue;seen[i]=1;cells.push([i,t,d,0]);next.push([nx,ny,d])}}layer=next}

function floodState(c,lvl){const d=c[2];if(d===1)return lvl>.7?2:lvl>.15?1:0;if(d===2)return lvl>.45?1:0;return lvl>.8?1:0}

  if(st===2&&(Math.floor(P.x)===c[0]%W&&Math.floor(P.y)===Math.floor(c[0]/W)))st=1;
  if(st!==c[3]||force){c[3]=st;const nt=st===0?c[1]:st===1?1:0;if(tiles[c[0]]!==nt){tiles[c[0]]=nt;ch++;
    if(st>0){const x=c[0]%W,y=Math.floor(c[0]/W);const cr=cropAtTile(x,y);if(cr){cropAt[c[0]]=0;crops[crops.indexOf(cr)]=null}const s=structAtTile(x,y);if(s&&!STR[s.k].floor&&s.hp>0&&WOOD_RE.test(s.k))s.hp-=15}}}}
 return ch}
function updFlood(dt){

 if(stormy&&!G.flood)planFlood();

const _fleeRadius=fleeRadius;

 if(nearLightV10())r*=1.3;if(nightAmt()>.6)r*=.85;r+=B().dirt>60?1.2:0;return r}

const _updAnimal=updAnimal;
updAnimal=function(a,dt){
 const D=ANIMALS[a.d];if(a.tame&&CANINE.has(D.name)){companion(a,dt);return}
 const dp=Math.hypot(P.x-a.x,P.y-a.y);
 if(dp>46){return _updAnimal(a,dt)}
 curA=a;const oh=G.settings.hostile,os=D.spd;
 const b=B();
 // up in a treehouse/tower: ground creatures cannot reach
 if((b.up||b.tower)&&D.kind!=='i'&&dp<20)G.settings.hostile=false;
 // insects love dirty people
 if(D.kind==='i'&&b.dirt>55&&dp<5&&rnd()<dt*.15&&oh)a.agro=Math.max(a.agro,4);
 if(D.beh==='a'&&oh&&!a.tame){
  const det=detectRange(a);
  const spotted=a.agro>0||dp<det;
  if(!spotted){G.settings.hostile=false;a.stalk=0}
  else{
   if(a.agro<=0&&!a.seen){a.seen=1;if(dp<14)floatTxt(a.x,a.y-.7,CANINE.has(D.name)?'!':'👁','#ff8a5a')}
   if(CANINE.has(D.name)){ // pack
    D.spd=os*1.04;
    if(a.agro>0&&!a.callT){a.callT=1;for(const o of animals)if(o!==a&&ANIMALS[o.d].name===D.name&&!o.tame&&Math.hypot(o.x-a.x,o.y-a.y)<16)o.agro=Math.max(o.agro,8);if(dp<20)toast('The wolves have your scent!','bad')}
    // circle before lunge
    if(a.agro>0&&dp>3.2&&dp<8&&(a.cd>0||rnd()<.01)){const ang=Math.atan2(a.y-P.y,a.x-P.x)+dt*1.4;a.tx=P.x+Math.cos(ang)*5;a.ty=P.y+Math.sin(ang)*5}
   }else if(CATS.has(D.name)){ // ambush: creep then pounce
    if(dp>4.2)D.spd=os*.5;else D.spd=os*2.1;
    if(dp<10&&dp>4.2&&!a.stalk){a.stalk=1;if(rnd()<.5)floatTxt(a.x,a.y-.7,'…','#ccc')}
    const bx=P.x-a.x,by=P.y-a.y;// approach from behind if possible
    if(dp>4.2&&(P.fx*bx+P.fy*by)/dp>0){const px=-P.fy,py=P.fx;a.tx=a.x+px*.6;a.ty=a.y+py*.6}
   }else if(D.name==='Giant Spider'){D.spd=os*1.25}
  }
 }
 else if(D.beh==='h'&&oh){ // snakes & scorpions: warn, strike, retreat
  if(a.retreat>0){a.retreat-=dt;const dx=a.x-P.x,dy=a.y-P.y,l=Math.hypot(dx,dy)||1;moveEnt(a,dx/l*D.spd*1.2*dt,dy/l*D.spd*1.2*dt,.2);G.settings.hostile=false}
  else{
   if(D.name==='Rattlesnake'&&dp<3.6&&dp>1.5&&!(a.rtl>0)){a.rtl=2.5;floatTxt(a.x,a.y-.7,'~tss~','#e8d890');sfx('hit')}
   a.rtl=Math.max(0,(a.rtl||0)-dt);
   const cd0=a.cd;
   if(dp>det2(a))G.settings.hostile=false;
  }
 }
 _updAnimal(a,dt);
 if(D.beh==='h'&&!(a.retreat>0)&&a.cd>1.4&&dp<1.6)a.retreat=3.2;
 D.spd=os;G.settings.hostile=oh;curA=null;
};

 }}

function placeDens(){
 G.dens=[];const preds=animals.filter(a=>{const D=ANIMALS[a.d];return D.beh==='a'||D.name==='Black Bear'});
 const used=[];for(const a of preds){if(G.dens.length>=14)break;if(used.some(u=>Math.hypot(u.x-a.home.x,u.y-a.home.y)<18))continue;
  const x=Math.floor(a.home.x),y=Math.floor(a.home.y);if(tiles[y*W+x]<2||Math.hypot(x-spawnPt.x,y-spawnPt.y)<14)continue;used.push(a.home);
  const o=objAtTile(x,y);if(o&&o.k!=='ground'){o.dead=1;objAt[y*W+x]=0}
  G.dens.push({x,y,n:ANIMALS[a.d].name,found:0});
  for(const b of animals)if(ANIMALS[b.d].name===ANIMALS[a.d].name&&Math.hypot(b.home.x-x,b.home.y-y)<10)b.home={x:x+.5,y:y+.5}}}

function migrate(){
 const sn=season();const HERD=new Set(['Deer','Elk','Bison','Bighorn Sheep','Moose','Mountain Goat']);let n=0;
 for(const a of animals){const D=ANIMALS[a.d];if(a.tame||!HERD.has(D.name))continue;

function placeWrecks(){
 G.wrecks=[];let tries=0;
 while(G.wrecks.length<4&&tries++<14000){const p2=tries>6000;
  const x=6+Math.floor(rnd()*(W-12)),y=6+Math.floor(rnd()*(H-12));
  if(Math.hypot(x-spawnPt.x,y-spawnPt.y)<(G.wrecks.length?(p2?20:30):22))continue;if(G.wrecks.some(w=>Math.hypot(w.x-x,w.y-y)<(p2?20:30)))continue;
  if(!(tiles[y*W+x]===2||p2&&tiles[y*W+x]>=2&&tiles[y*W+x]<7))continue;let water=false;const wr=p2?6:3;for(let j=-wr;j<=wr;j++)for(let i=-wr;i<=wr;i++){if(tiles[(y+j)*W+x+i]<=1)water=true}if(!water)continue;
  let clear=true;for(let j=-2;j<=2&&clear;j++)for(let i=-2;i<=2;i++){const t=tiles[(y+j)*W+x+i];if(t<2||structAt[(y+j)*W+x+i]){clear=false;break}}if(!clear)continue;
  const id=G.wrecks.length;G.wrecks.push({x,y,id,found:0});
  for(let j=-2;j<=2;j++)for(let i=-2;i<=2;i++){const o=objAtTile(x+i,y+j);if(o&&o.k!=='ground'){o.dead=1;objAt[(y+j)*W+x+i]=0}}
  placeStruct('wreck',x,y);
  const spots=[[-2,1],[2,0],[1,2],[-1,-2]];
  for(let q=0;q<4;q++){const c=placeStruct('crate',x+spots[q][0],y+spots[q][1]);c.loot=wreckLoot(id,q)}
 }}
function wreckLoot(w,q){
 const l={};const lore=w*4+q;if(lore<LORE.length)l['lore_'+lore]=1;
 const need=[['radio_parts','battery'],['flare_gun','flare'],['sail','rope'],['bandage','canteen_clean']][w];
 if(q===0)need.forEach(k=>{if(ITEMS[k])l[k]=k==='flare'?2:k==='rope'?3:1});
 if(q===1&&w===0&&ITEMS.battery)l.battery=1;if(q===1&&w===1&&ITEMS.flare)l.flare=1;
 const misc=[['bandage',1,2],['jerky',2,4],['canteen_clean',1,1],['arrow',3,8],['rope',1,2],['flint',1,2],['bead',2,6],['coal',2,4],['antidote',1,1]];
 for(const p of misc)if(ITEMS[p[0]]&&rnd()<.3)l[p[0]]=(l[p[0]]||0)+p[1]+Math.floor(rnd()*(p[2]-p[1]+1));
 return l}
function lootCrate(s){
 if(s.looted){toast('Already searched.');return}
 s.looted=1;const items=s.loot||{};let any=false;
 for(const k in items){if(ITEMS[k]){addInv(k,items[k]);any=true}}

  let ok=true;for(let j=-4;j<=4&&ok;j++)for(let i=-4;i<=4;i++){const t=tiles[(y+j)*W+x+i];if(t<2||structAt[(y+j)*W+x+i]){ok=false;break}}if(!ok)continue;
  if(G.camps&&G.camps.some(c=>Math.hypot(c.x-x,c.y-y)<14))continue;if(G.caves&&G.caves.some(c=>Math.hypot(c.x-x,c.y-y)<14))continue;best={x,y};break}
 if(!best){tries=0;while(tries++<4000){const x=10+Math.floor(rnd()*(W-20)),y=10+Math.floor(rnd()*(H-20));if(Math.hypot(x-spawnPt.x,y-spawnPt.y)<30)continue;if(tiles[y*W+x]<2)continue;best={x,y};break}}
 if(!best)return;G.village={x:best.x,y:best.y,found:0};
 for(let j=-4;j<=4;j++)for(let i=-4;i<=4;i++){const o=objAtTile(best.x+i,best.y+j);if(o&&o.k!=='ground'){o.dead=1;objAt[(best.y+j)*W+best.x+i]=0}}

function saveLegacy(){
 try{
  const top=Object.keys(inv).filter(k=>inv[k]>0&&ITEMS[k].cat!=='tool'||false).slice(0,0);
  const keep={};const ids=Object.keys(inv).filter(k=>inv[k]>0&&k!=='rotten');ids.sort((a,b)=>(inv[b]||0)-(inv[a]||0));
  let n=0;for(const k of ids){if(n>=9)break;const q=Math.max(1,Math.floor(inv[k]*.5));keep[k]=q;n++}
  const notes=['I kept going longer than I thought I would.','The nights were the worst. Keep a fire.','Never trust the water.','If you read this, you are doing better than me.','The wolves are patient. Be more patient.'];
  const lg={name:P.ch.name,day:dayNum(),x:Math.floor(P.x),y:Math.floor(P.y),seed:G.seed,inv:keep,note:notes[Math.floor(rnd()*notes.length)],mode:G.mode};
  localStorage.setItem('wildroot_legacy',JSON.stringify(lg))}catch(e){}}
function placeLegacy(){
 let lg=null;try{lg=JSON.parse(localStorage.getItem('wildroot_legacy')||'null')}catch(e){}
 if(!lg||G.mode==='sandbox')return;
 let x,y;
 if(lg.seed===G.seed){x=lg.x;y=lg.y}else{const a=rnd()*6.28,d=rr(14,22);x=Math.floor(spawnPt.x+Math.cos(a)*d);y=Math.floor(spawnPt.y+Math.sin(a)*d)}

  let free=true;for(let q=-1;q<=1;q++)for(let w=-1;w<=1;w++){const t=tiles[(ty+q)*W+tx+w];if(t<2||structAt[(ty+q)*W+tx+w])free=false}if(!free)continue;x=tx;y=ty;ok=true;break}
 if(!ok)return;
 for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const o=objAtTile(x+i,y+j);if(o&&o.k!=='ground'){o.dead=1;objAt[(y+j)*W+x+i]=0}}
 const g=placeStruct('grave',x,y);g.legacy={name:lg.name,day:lg.day,note:lg.note};
 const c=placeStruct('chest',x+1,y+1);c.inv=Object.assign({},lg.inv);
 const f=placeStruct('campfire',x-1,y+1);f.fuel=0;f.lit=0;

 addMarker(x,y,'#8a8a8a','Old camp','🪦',true);
 setTimeout(()=>{if(G&&G.legacyCamp)toast('Somewhere out there lies the old camp of '+lg.name+', who lasted '+lg.day+' days. Their chest may still hold supplies.','good')},4000);

// ---------- swimming ----------
let swimming=false,swimHint=false,swimSplash=0;
const _moveEntV12=moveEnt;

 if(e!==P||typeof G==='undefined'||!G)return _moveEntV12(e,dx,dy,r);
 const tile=tileAt(P.x,P.y);
 const inDeep=tile===0&&!(structAtTile(Math.floor(P.x),Math.floor(P.y))||{}).bridge&&!((structAtTile(Math.floor(P.x),Math.floor(P.y))||{}).k==='bridge');
 const canEnter=P.stam>18||inDeep;

 try{
  if(SWIMMING){
   // gentle current in deep water
   if(inDeep){const a=hash2(Math.floor(P.x/6),Math.floor(P.y/6),5)*6.28;dx+=Math.cos(a)*.0025;dy+=Math.sin(a)*.0025}
   _moveEntV12(e,dx*(inDeep?.55:1),dy*(inDeep?.55:1),r)}
  else _moveEntV12(e,dx,dy,r);
 }finally{SWIMMING=false}
};

  const wx=camX+(e.clientX-SW/2)/TS,wy=camY+(e.clientY-SH/2)/TS;let txt='';

  if(!txt){const ox=Math.floor(wx),oy=Math.floor(wy),o=objAtTile(ox,oy);if(o&&!o.dead){const tb={tree:TREES,plant:PLANTS,flower:FLOWERS,edible:EDIBLES}[o.k];if(tb&&tb[o.t])txt=tb[o.t].name+(o.k==='tree'?' tree':'')}}

// ---------- ambient life: fireflies, birds, cloud shadows, lily pads, shimmer ----------
const FF=[];const BIRDS=[];
function v12Ambient(dt){
 if(QL==='low'||TS<20)return;
 const night=nightAmt();
 // fireflies near grass at dusk / night
 if(night>.35&&SN!==3&&FF.length<26&&Math.random()<dt*3){const a=Math.random()*6.28,r=3+Math.random()*7,x=P.x+Math.cos(a)*r,y=P.y+Math.sin(a)*r,t=tileAt(x,y);if(t>=2&&t<=4)FF.push({x,y,ph:Math.random()*6.28,l:6+Math.random()*6})}
 for(let i=FF.length-1;i>=0;i--){const f=FF[i];f.l-=dt;f.ph+=dt*2;f.x+=Math.cos(f.ph*.7)*dt*.4;f.y+=Math.sin(f.ph*.9)*dt*.3;if(f.l<0||Math.hypot(f.x-P.x,f.y-P.y)>14||night<.2){FF.splice(i,1);continue}
  const a=Math.max(0,Math.sin(f.ph*3))*Math.min(1,f.l);const x=sx(f.x),y=sy(f.y);if(x<-10||y<-10||x>SW+10||y>SH+10)continue;
  ctx.fillStyle=`rgba(220,255,120,${.8*a})`;ctx.beginPath();ctx.arc(x,y,2.2,0,6.3);ctx.fill();ctx.fillStyle=`rgba(220,255,120,${.18*a})`;ctx.beginPath();ctx.arc(x,y,7,0,6.3);ctx.fill()}
 // birds crossing the sky in daytime
 if(night<.3&&BIRDS.length<3&&Math.random()<dt*.05){const y=P.y+(Math.random()-.5)*12;BIRDS.push({x:P.x-16,y,vx:2+Math.random()*1.5,n:2+Math.floor(Math.random()*3),ph:Math.random()*6})}
 for(let i=BIRDS.length-1;i>=0;i--){const b=BIRDS[i];b.x+=b.vx*dt;b.ph+=dt*9;if(b.x>P.x+18){BIRDS.splice(i,1);continue}
  ctx.strokeStyle='rgba(20,24,20,.55)';ctx.lineWidth=1.5;for(let k=0;k<b.n;k++){const x=sx(b.x-k*.7),y=sy(b.y+k*.35)-TS*1.8,f=Math.sin(b.ph+k)*3;ctx.beginPath();ctx.moveTo(x-5,y+f);ctx.lineTo(x,y);ctx.lineTo(x+5,y+f);ctx.stroke()}}
 // drifting cloud shadows
 if(night<.5&&(typeof wxNow==='undefined'||true)){ctx.save();ctx.fillStyle='rgba(10,20,30,.07)';for(let k=0;k<4;k++){const x=((T0*14+k*420)%(SW+500))-250,y=(k*173+60)%SH;ctx.beginPath();ctx.ellipse(x,y,170,70,0,0,6.3);ctx.fill()}ctx.restore()}
}

// ---------- better trees ----------
const BARKY=new Set(['Birch','Aspen','Dogwood']);
function leafClump(cx,cy,r,col,seed){
 const n=QL==='low'?4:7;ctx.fillStyle=col;
 for(let k=0;k<n;k++){const a=k/n*6.28+seed,rr2=r*(.55+.25*hash2(seed*9|0,k,3)),x=cx+Math.cos(a)*r*.58,y=cy+Math.sin(a)*r*.5;ctx.beginPath();ctx.arc(x,y,rr2,0,6.3);ctx.fill()}
 ctx.beginPath();ctx.arc(cx,cy,r*.75,0,6.3);ctx.fill();
}
function shadeCol(c,k){const m=/^#(..)(..)(..)$/.exec(c);if(!m)return c;const f=v=>Math.max(0,Math.min(255,Math.round(parseInt(v,16)*k)));return `rgb(${f(m[1])},${f(m[2])},${f(m[3])})`}
const _drawTreeV12V12=drawTree;
drawTree=function(o,cx,by){
 const T0_=TREES[o.t];
 if(o.st||PALM.has(T0_.name)){return _drawTreeV12V12(o,cx,by)}
 const lowq=QL==='low'||TS<20;
 const T=Object.assign({},T0_,{leaf:seasonCol(T0_.leaf,CONE.has(T0_.name))});
 const sz=.9+.07*T.hard,occl=P.y<o.y+.6&&P.y>o.y-1.7&&Math.abs(P.x-(o.x+.5))<.95,seed=hash2(o.x,o.y,17);
 shadow(cx,by,TS*.46*sz,TS*.13);
 if(occl)ctx.globalAlpha=.55;
 const tw=T.name==='Baobab'?TS*.36:T.name==='Redwood'?TS*.27:TS*.18,dark=shadeCol(T.trunk,.7),lite=shadeCol(T.leaf,1.22),deep=shadeCol(T.leaf,.72);
 const leanX=(seed-.5)*TS*.06;
 // trunk with taper, roots and bark detail
 const th=CONE.has(T.name)?TS*.36:TS*.55;
 ctx.fillStyle=T.trunk;ctx.beginPath();ctx.moveTo(cx-tw*.75,by);ctx.lineTo(cx-tw*.45+leanX,by-th);ctx.lineTo(cx+tw*.45+leanX,by-th);ctx.lineTo(cx+tw*.75,by);ctx.closePath();ctx.fill();
 ctx.fillStyle=dark;ctx.beginPath();ctx.moveTo(cx+tw*.1,by);ctx.lineTo(cx+tw*.1+leanX*.5,by-th);ctx.lineTo(cx+tw*.45+leanX,by-th);ctx.lineTo(cx+tw*.75,by);ctx.closePath();ctx.fill();
 ctx.fillStyle=dark;ctx.fillRect(cx-tw*1.05,by-3,tw*.5,3);ctx.fillRect(cx+tw*.55,by-3,tw*.5,3);
 if(!lowq){if(BARKY.has(T.name)){ctx.fillStyle='#2a2a2a';for(let k=0;k<4;k++)ctx.fillRect(cx-tw*.4+hash2(k,seed*99|0,2)*tw*.6,by-th*(.15+k*.2),tw*.35,2)}
  else{ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=1;for(let k=0;k<3;k++){ctx.beginPath();ctx.moveTo(cx-tw*.2+k*tw*.2,by-2);ctx.lineTo(cx-tw*.2+k*tw*.2+leanX,by-th+2);ctx.stroke()}}}
 if(CONE.has(T.name)){
  const tiers=lowq?3:4,snow=SN===3;
  for(let k=0;k<tiers;k++){
   const w=TS*(.56-k*.1)*sz,y=by-TS*(.16+k*.27),hh=TS*.46,wob=Math.sin(T0*1.4+k+seed*9)*1.2;
   ctx.fillStyle=k%2?deep:T.leaf;ctx.beginPath();ctx.moveTo(cx-w,y);ctx.lineTo(cx-w*.55,y-hh*.12);ctx.lineTo(cx+wob*.5,y-hh);ctx.lineTo(cx+w*.55,y-hh*.12);ctx.lineTo(cx+w,y);ctx.closePath();ctx.fill();
   ctx.fillStyle=lite;ctx.globalAlpha=(occl?.55:1)*.35;ctx.beginPath();ctx.moveTo(cx-w,y);ctx.lineTo(cx+wob*.5,y-hh);ctx.lineTo(cx-w*.1,y-hh*.1);ctx.closePath();ctx.fill();ctx.globalAlpha=occl?.55:1;
   if(!lowq){ctx.fillStyle=deep;for(let q=0;q<3;q++){const bx=cx-w+q*w*.7+(hash2(q,k,seed*50|0)*4);ctx.fillRect(bx,y-2,3,3)}}
   if(snow){ctx.fillStyle='rgba(255,255,255,.85)';ctx.beginPath();ctx.moveTo(cx-w*.45,y-hh*.28);ctx.lineTo(cx+wob*.5,y-hh);ctx.lineTo(cx+w*.45,y-hh*.28);ctx.lineTo(cx,y-hh*.2);ctx.closePath();ctx.fill()}
  }
  if(T.fruit&&!o.d&&!lowq){ctx.fillStyle='#7a4a22';for(let k=0;k<3;k++){ctx.beginPath();ctx.ellipse(cx+(k-1)*TS*.16,by-TS*(.4+k%2*.3),2.5,4,0,0,6.3);ctx.fill()}}
 }else{
  const r=TS*.37*sz,cy=by-TS*.76*sz,wil=T.name==='Willow',bao=T.name==='Baobab';
  // branches
  ctx.strokeStyle=T.trunk;ctx.lineWidth=Math.max(2,tw*.4);ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(cx+leanX,by-th*.7);ctx.lineTo(cx-r*.55,cy+r*.2);ctx.moveTo(cx+leanX,by-th*.8);ctx.lineTo(cx+r*.55,cy+r*.25);ctx.stroke();ctx.lineCap='butt';
  // back layer, main, front highlight
  leafClump(cx,cy+r*.2,r*1.02,deep,seed*5);
  leafClump(cx,cy,r*.95,T.leaf,seed*3);
  if(!lowq){ctx.fillStyle=lite;ctx.globalAlpha=(occl?.55:1)*.5;leafClump(cx-r*.28,cy-r*.3,r*.55,lite,seed*7);ctx.globalAlpha=occl?.55:1;
   ctx.fillStyle='rgba(0,0,0,.14)';ctx.beginPath();ctx.ellipse(cx+r*.45,cy+r*.55,r*.55,r*.3,0,0,6.3);ctx.fill();
   // leaf speckles
   ctx.fillStyle=lite;for(let k=0;k<9;k++){const a=hash2(k,seed*77|0,1)*6.28,d=hash2(k,seed*77|0,2)*r*.9;ctx.fillRect(cx+Math.cos(a)*d,cy+Math.sin(a)*d*.8,2,2)}}
  if(wil){ctx.strokeStyle=T.leaf;ctx.lineWidth=2;for(let k=0;k<9;k++){const x=cx-r*1.1+k*r*.28,sw=Math.sin(T0*1.2+k+seed*9)*2;ctx.beginPath();ctx.moveTo(x,cy+r*.4);ctx.quadraticCurveTo(x+sw,cy+r*.9,x+sw*1.5,cy+r*1.35);ctx.stroke()}}
  if(bao){ctx.fillStyle=T.trunk;ctx.fillRect(cx-tw*.7,by-TS*.5,tw*1.4,TS*.18)}
  if(T.fruit&&!o.d){ctx.fillStyle=FRUITCOL[T.fruit]||'#d8b050';for(let k=0;k<6;k++){const a=k*1.9+seed*5,x=cx+Math.cos(a)*r*.78,y=cy+Math.sin(a*1.3)*r*.62;ctx.beginPath();ctx.arc(x,y,TS*.05,0,6.3);ctx.fill();if(!lowq){ctx.fillStyle='rgba(255,255,255,.55)';ctx.fillRect(x-1,y-2,1.5,1.5);ctx.fillStyle=FRUITCOL[T.fruit]||'#d8b050'}}}
  if(SN===3){ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.ellipse(cx,cy-r*.65,r*.7,r*.2,0,0,6.3);ctx.fill()}
 }
 if(o.hive){ctx.fillStyle='#8a5a2a';ctx.beginPath();ctx.ellipse(cx+TS*.22,by-TS*.6,TS*.08,TS*.13,0,0,6.3);ctx.fill();ctx.fillStyle='#e8b82a';ctx.fillRect(cx+TS*.2+Math.sin(T0*9)*3,by-TS*.7+Math.cos(T0*7)*3,2,2)}
 ctx.globalAlpha=1;
};

 if(o.k==='rock'){ctx.fillStyle=o.sub==='coal'?'#444':'#858585';ctx.fillRect(cx-TS*.28,by-TS*.4,TS*.56,TS*.4);return}

 ['first_blood','First Blood','Defeat any creature.',()=>(S.kills|0)>=1],

// ---------- per-frame update ----------
let v13T=0,v13Slow=0;
const _updV10bX13=updV10;
updV10=function(dt){
 _updV10bX13(dt);
 const v=V13();
 // dodge roll
 if(P.roll&&P.roll.t>0){P.roll.t-=dt;moveEnt(P,P.roll.dx*7.5*dt,P.roll.dy*7.5*dt,.28);if(Math.random()<dt*30)parts.push({x:P.x,y:P.y+.3,vx:rr(-.3,.3),vy:rr(-.5,0),life:.3,col:'#d8c8a0',s:2})}
 if(P.hp<10&&P.hp>0&&!P.dead)v.lowHp=1;
 // swim time (swimming flag is from v1.2 module)
 if(typeof swimming!=='undefined'&&swimming)v.swim+=dt;
 v13T+=dt;if(v13T<2)return;v13T=0;
 checkAch();
 // best run record
 try{const d=dayNum(),b=+(localStorage.getItem('wildroot_best')||0);if(d>b)localStorage.setItem('wildroot_best',d)}catch(e){}
 // bandit camps refill after a while
 if(G.camps&&G.bandits)for(const c of G.camps){const n=G.bandits.filter(b=>b.cm===c.id).length;
  if(n>0){c.clr=0;continue}
  if(!c.clr){c.clr=G.clock;continue}
  if(G.clock-c.clr>DAY*6&&Math.hypot(c.x-P.x,c.y-P.y)>26){
   for(let k=0;k<3;k++)spawnBandit(c,k);c.clr=0;c.raided=0;
   const ch=structs.find(s=>s&&s.k==='chest'&&s.camp===c.id);if(ch)ch.inv=bandLoot();
   toast('Smoke rises in the distance. A bandit camp has been resettled.')}}
 // water warning

 // authored decoration zones

/* ---------- structures + landmarks (placed at new-game time, saved with the game) ---------- */
function staticSetup(idx){
 const M=STATIC_MAPS[idx-1];if(!M||!M.build)return;
 const land=(x,y)=>x>0&&y>0&&x<W-1&&y<H-1&&tiles[y*W+x]>=2;
 const clr=(x,y)=>{const i=objAt[y*W+x];if(i){objs[i-1].dead=1;objAt[y*W+x]=0}};
 const put=(k,x,y,water)=>{if(x<1||y<1||x>=W-1||y>=H-1)return null;if(!water&&!land(x,y))return null;if(water&&tiles[y*W+x]>1)return null;if(structAt[y*W+x])return null;clr(x,y);return placeStruct(k,x,y)};
 const loot=(o)=>{const r={};for(const k in o)if(ITEMS[k])r[k]=o[k];return r};
 const B={
  put,
  hut(x,y,w,h,door,o){o=o||{};for(let j=0;j<h;j++)for(let i=0;i<w;i++){const edge=i===0||j===0||i===w-1||j===h-1;
    if(edge)put('wall_wood',x+i,y+j);else put('floor_wood',x+i,y+j)}
   const dx=door==='n'||door==='s'?x+(w>>1):door==='e'?x+w-1:x,dy=door==='n'?y:door==='s'?y+h-1:y+(h>>1);
   const s=structAtTile(dx,dy);if(s)removeStruct(s);put('door_wood',dx,dy);
   if(o.bed)put('bed',x+1,y+1);if(o.chest){const c=put('chest',x+w-2,y+h-2);if(c)c.inv=loot(o.chest)}if(o.bench)put('workbench',x+w-2,y+1);
   if(o.fire){const f=put('campfire',dx+(door==='e'?2:door==='w'?-2:0),dy+(door==='s'?2:door==='n'?-2:0));if(f){f.lit=1;f.fuel=9999;f.camp=0;f.perm=1}}},
  stoneHut(x,y,w,h,door,o){o=o||{};for(let j=0;j<h;j++)for(let i=0;i<w;i++){const edge=i===0||j===0||i===w-1||j===h-1;if(edge)put('wall_stone',x+i,y+j);else put('floor_stone',x+i,y+j)}
   const dx=door==='n'||door==='s'?x+(w>>1):door==='e'?x+w-1:x,dy=door==='n'?y:door==='s'?y+h-1:y+(h>>1);
   const s=structAtTile(dx,dy);if(s)removeStruct(s);put('door_wood',dx,dy);if(o.chest){const c=put('chest',x+w-2,y+h-2);if(c)c.inv=loot(o.chest)}
   if(o.fire){const f=put('campfire',x+1,y+1);if(f){f.lit=1;f.fuel=9999;f.perm=1}}},
  ruin(x,y,w,h,gap){for(let j=0;j<h;j++)for(let i=0;i<w;i++){if(!(i===0||j===0||i===w-1||j===h-1))continue;if(hash2(x+i,y+j,idx*13)<(gap||.3))continue;put('wall_stone',x+i,y+j)}},
  dock(x,y,dx,dy,len){for(let i=0;i<len;i++)put('bridge',x+dx*i,y+dy*i,true)||put('bridge',x+dx*i,y+dy*i,false)},
  bridge(x0,y0,x1,y1){const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0));for(let i=0;i<=n;i++){const x=Math.round(x0+(x1-x0)*i/n),y=Math.round(y0+(y1-y0)*i/n);if(tiles[y*W+x]<=1)put('bridge',x,y,true)}},
  fence(x0,y0,x1,y1){for(let x=x0;x<=x1;x++){put('fence',x,y0);put('fence',x,y1)}for(let y=y0+1;y<y1;y++){put('fence',x0,y);put('fence',x1,y)}},
  well(x,y){put('well',x,y)},
  chest(x,y,l){const c=put('chest',x,y);if(c)c.inv=loot(l||{})},
  camp(x,y){const f=put('campfire',x,y);if(f){f.lit=1;f.fuel=9999;f.perm=1}put('tent',x-2,y-1);put('bed_leaf',x+2,y)},
  beacon(x,y){put('wall_stone',x-1,y-1);put('wall_stone',x+1,y-1);put('wall_stone',x-1,y);put('wall_stone',x+1,y);put('wall_stone',x-1,y+1);put('wall_stone',x+1,y+1);put('wall_stone',x,y+1);
   put('floor_stone',x,y-1);const f=put('campfire',x,y);if(f){f.lit=1;f.fuel=99999;f.perm=1}},
  stones(cx,cy,r,n){return;for(let k=0;k<n;k++){const a=k/n*6.2832,x=Math.round(cx+Math.cos(a)*r),y=Math.round(cy+Math.sin(a)*r);if(!land(x,y))continue;clr(x,y);const o={k:'rock',sub:'stone',x,y,hp:60,d:0,rg:0,dead:0};objs.push(o);objAt[y*W+x]=objs.length}},
  farm(x,y,w,h){for(let j=0;j<h;j++)for(let i=0;i<w;i++)if(land(x+i,y+j)){clr(x+i,y+j);soil[(y+j)*W+x+i]=1}B.fence(x-1,y-1,x+w,y+h)},
  grave(x,y){put('grave',x,y)}
 };
 M.build(B);
 // landmarks: keep markers on land
 M.lmFix=M.lm.map(l=>{let x=l[1],y=l[2];if(!land(x,y)){let bd=1e9;for(let j=-10;j<=10;j++)for(let i=-10;i<=10;i++)if(land(x+i,y+j)&&Math.hypot(i,j)<bd){bd=Math.hypot(i,j);var bx=x+i,by=y+j}if(bd<1e9){x=bx;y=by}}return [l[0],x,y,l[3]||'📍']});
 G.stat={idx,rev:{}};
}
function staticLandmarks(){const M=STATIC_MAPS[(G.map||0)-1];if(!M)return [];return M.lmFix||(M.lmFix=M.lm.map(l=>[l[0],l[1],l[2],l[3]||'📍']))}

  const M=STATIC_MAPS[idx-1];

function chronObj(){const M=STATIC_MAPS[(G.chron?G.chron.idx:1)-1];return M?M.obj:[]}
function objProg(o){
 if(o.t==='reach'){const l=staticLandmarks().find(q=>q[0]===o.lm);if(!l)return[0,1];const d=Math.hypot(l[1]-P.x,l[2]-P.y);if(d<=(o.r||5))G.chron.done['r'+o.lm]=1;return[G.chron.done['r'+o.lm]?1:0,1]}
 if(o.t==='have')return[Math.min(o.n,inv[o.id]|0),o.n];
 if(o.t==='place')return[Math.min(o.n,((S.placed||{})[o.k])|0),o.n];
 if(o.t==='kills'){const b=G.chron.k0||0;return[Math.min(o.n,(S.kills|0)-b),o.n]}
 if(o.t==='lamp'){const l=staticLandmarks().find(q=>q[0]===o.lm);if(!l)return[0,1];const k='l'+o.lm;if(!G.chron.done[k]&&P.torchOn&&Math.hypot(l[1]-P.x,l[2]-P.y)<=(o.r||4)){G.chron.done[k]=1;try{lightLantern(l)}catch(e){}}return[G.chron.done[k]?1:0,1]}
 if(o.t==='stat'){const b=(G.chron.s0=G.chron.s0||{});if(b[o.key]==null)b[o.key]=S[o.key]|0;return[Math.min(o.n,(S[o.key]|0)-b[o.key]),o.n]}
 if(o.t==='days')return[Math.min(o.n,dayNum()-Math.floor(G.chron.t0/DAY)-1),o.n];
 return[0,1]}
function chronCheck(){
 if(!G.chron||G.chron.finished)return;
 if(G.chron.k0==null)G.chron.k0=S.kills|0;
 let all=true;for(const o of chronObj()){const p=objProg(o);const key='o'+o.txt;if(p[0]>=p[1]){if(!G.chron.done[key]){G.chron.done[key]=1;toast('✅ '+o.txt,'good');try{sfx('learn')}catch(e){}}}else all=false}
 if(all&&!G.chron.ready){G.chron.ready=1;const last=G.chron.idx>=CHEND();toast(last?'🏆 '+CHNAME()+' complete! Open the Menu [Esc] for your ending.':'🌀 Chapter complete! Open the Menu [Esc] to travel onward.','good')}
}

 if(G.chron.idx>=CHEND()){G.chron.finished=true;closePanel();toast(G.mode==='jungle'?'🧭 The expedition is complete. The jungle is yours to wander.':G.mode==='saga'?'🏮 Every lantern is lit. The road is yours to wander.':'🏆 You have walked every land of the Chronicle. The world is yours to wander.','good');return}
 const next=G.chron.idx+1,og=G,op=P,oi=inv,os=S;

 newGame({mode:og.mode,charId:og.charId,seed:-next,density:1,chronIdx:next});
 // carry the journey over
 inv=oi;S=os;
 for(const k of ['learned','gotEver','disc','know','dur','armor','hot','sel','b','v13','v14','v17','ach'])if(og[k]!==undefined)G[k]=og[k];
 G.clock=og.clock;G.settings=Object.assign(G.settings,{timeScale:1});
 for(const k of ['hp','hunger','thirst','energy','stam','warm','st','ch','torchOn'])if(op[k]!==undefined)P[k]=op[k];
 P.hp=Math.min(100,P.hp+25);P.hunger=Math.max(P.hunger,55);P.thirst=Math.max(P.thirst,55);P.dead=false;
 G.chron={idx:next,done:{},t0:G.clock,finished:false};
 G.map=next;camSnap();miniRebuild();refreshQuest();saveGame(true);
 toast('🌀 Chapter '+next+': '+STATIC_MAPS[next-1].name,'good');
}
const _renderPauseStat=renderPause;

 d.innerHTML=`<div class="h3">${CHNAME().toUpperCase()}</div><div style="font-size:13px;color:var(--dim)">Land ${CHNO(G.chron.idx)} of ${CHTOT()}: <b style="color:var(--ink)">${STATIC_MAPS[G.chron.idx-1].name}</b></div>
 ${G.chron.ready?`<button class="primary" id="travelOn" style="margin-top:8px;padding:8px 18px">${last?(G.mode==='jungle'?'🧭 Complete the Expedition':G.mode==='saga'?'🏮 Complete the Saga':'🏆 Complete the Chronicle'):'🌀 Travel onward to '+STATIC_MAPS[G.chron.idx].name}</button>`:'<div style="margin-top:6px;font-size:13px;color:var(--dim)">Finish every goal in the quest panel to unlock travel.</div>'}`;
 pl.insertBefore(d,pl.firstChild)};
document.addEventListener('click',e=>{if(e.target.id==='travelOn')travelOn()});

const GUIDE32=[
 ['start','Welcome',`<p>Wildroot is a top-down survival game. You wash ashore with almost nothing and must find food, clean water, warmth and rest while the world turns through day and night, four seasons and changing weather.</p>
 <p>There are no cutscenes and no fixed route. Everything you need is in the world: <b>plants, animals, fish, trees, ores and ruins</b>. You craft your own tools, build a base, farm, tame animals, trade, and in Story mode work toward being rescued.</p>
 <h4>If you read nothing else</h4><ol><li>Pick a mode and a character, press <b>New Game</b>.</li><li>Collect sticks, stones and fibre. Press ${kb32('N')} and craft a <b>Stone Axe</b>.</li><li>Get logs, build a <b>campfire</b>, light it, boil water, eat cooked food.</li><li>Never eat unknown plants raw. <b>Taste</b> them first from your Pack.</li><li>Build a bed and walls before your second night.</li></ol>
 <p class="gd-note">Tip: press ${kb32('F1')} or ${kb32('?')} at any time for the controls and an icon legend. On this home screen, ${kb32('F1')} opens this guide.</p>`],
 ['controls','Controls',`<table class="gd-t"><tr><th>Action</th><th>Keyboard / mouse</th></tr>
 <tr><td>Move</td><td>${kb32('W')} ${kb32('A')} ${kb32('S')} ${kb32('D')} or arrow keys</td></tr>

 <tr><td>Dodge roll</td><td>${kb32('G')}</td></tr>

 <tr><td>Interact, pick up, open, fill</td><td>${kb32('E')}</td></tr>
 <tr><td>Eat or drink the selected item</td><td>${kb32('F')} (also ${kb32('B')} safest food, ${kb32('Y')} drink, ${kb32('U')} medicine)</td></tr>
 <tr><td>Choose hotbar slot</td><td>${kb32('1')}–${kb32('9')} or mouse wheel</td></tr>

 <tr><td>Zoom</td><td>${kb32('+')} / ${kb32('-')} or the zoom box, bottom right</td></tr></table>`],
 ['screen','Reading the screen',`<ul><li><b>Top left bars</b>: ❤️ health, 🌡️ warmth, 🍖 hunger, 💧 thirst, 🌙 energy, ⚡ stamina. A bar that is almost empty needs your attention now.</li>
 <li><b>Top right</b>: day, season, time, weather and wind; below it the <b>minimap</b>. Click the minimap to open the full map.</li>
 <li><b>Bottom</b>: the hotbar, nine slots. The selected item is what Click, Space and ${kb32('F')} use.</li>
 <li><b>Quest panel</b>: your current Story goal (Story mode). Click its title to fold it.</li>
 <li><b>Condition chips</b> (bleeding, sick, wet, cold…) appear under the bars when something is wrong.</li>
 <li><b>Plant icons</b> float above wild plants once you have learned them: ☠ poison, ✓ edible, ✚ medicinal, ! irritant. A yellow ⚠ marks a suspicious plant only for characters who can spot poison.</li></ul>`],
 ['day1','Your first day',`<p>A suggested order. Each step matches a Story chapter, so Story mode will guide you through it too.</p><div id="gdChk"></div>
 <ol class="gd-steps"><li><b>Gather.</b> Sticks, stones, fibre. Check the ground near the shore.</li><li><b>Stone Axe.</b> Notebook ${kb32('N')} → Tools → Stone Axe.</li><li><b>Logs.</b> Chop a tree. Build the pack up to 3+ logs.</li><li><b>Campfire.</b> Notebook → Build → Campfire. Place it. Craft a Fire Drill and press ${kb32('E')} at the fire.</li><li><b>Water.</b> Fill the canteen at the shore (${kb32('E')}). Boil it at the fire. Drink it with ${kb32('F')}.</li><li><b>Learn the land.</b> Taste three different plants from your Pack. Note what hurts.</li><li><b>Food.</b> Fish with a rod or hunt small animals. Cook before eating.</li><li><b>Before dark.</b> Build a bed. Keep the fire burning. Sleep with ${kb32('Z')}.</li></ol>
 <p class="gd-note">Survival tip: do not wander far at night in the first days. Predators are bolder after dark and you cannot see much without a torch.</p>`],
 ['needs','Needs & health',`<table class="gd-t"><tr><th>Bar</th><th>Drops when</th><th>Fix it</th></tr>
 <tr><td>🍖 Hunger</td><td>Always, faster when running or fighting</td><td>Eat cooked meat, fish, stews, ripe crops, safe berries and nuts</td></tr>
 <tr><td>💧 Thirst</td><td>Always, faster in hot biomes and when running</td><td>Drink boiled or rain water, or well water. Raw water makes you sick</td></tr>
 <tr><td>🌡️ Warmth</td><td>Night, rain, snow, wind, wading</td><td>Stand by a fire, wear warm clothes, build shelter</td></tr>
 <tr><td>🌙 Energy</td><td>Over time awake</td><td>Sleep (${kb32('Z')}), best in a bed; rest (${kb32('R')}) helps a little</td></tr>
 <tr><td>⚡ Stamina</td><td>Running, rolling, swinging</td><td>Stop and walk. If you hit zero you are out of breath until it recovers</td></tr>
 <tr><td>❤️ Health</td><td>Hunger or thirst at zero, wounds, poison, cold, bites</td><td>Bandages, herbal poultices, tonic for poison, food and rest</td></tr></table>
 <p>Conditions such as bleeding, infection, broken legs, leeches and ticks have their own cures: bandages, splints, poultices, antiseptic plants and ${kb32('T')} to pull parasites. In Story and Sandbox modes needs drain more gently.</p>`],
 ['craft','Crafting & the Notebook',`<p>Press ${kb32('N')}. The Notebook lists every recipe, grouped in tabs: Survival, Clothing, Farming, Tools, Weapons, Hunting, Cooking, Build, Smelting and Medicine. Recipes you can afford are bright; others show what is missing.</p>
 <ul><li><b>Learn by finding.</b> Many recipes unlock the first time you pick up a specific item (a plant, an ore, a hide).</li><li><b>Stations.</b> Some recipes need you next to a campfire, workbench, furnace or drying rack.</li><li><b>Tiers.</b> Wood → stone → bone → copper → bronze → iron tools. Higher tiers chop harder woods, mine harder ore and last longer.</li><li><b>Durability.</b> Tools wear out. Carry a spare.</li><li>The <b>Asset Index</b> (home screen) shows what every item is made from and what it is used in.</li></ul>`],
 ['fire','Fire, water & cooking',`<ul><li><b>Fire.</b> Place a campfire, add a Fire Drill, press ${kb32('E')}. Rain can put it out. A fire gives warmth, light and a cooking station.</li><li><b>Water.</b> Fill an empty canteen at water. Dirty water must be boiled at a lit fire. Clean canteens are safe. Rain fills a held empty canteen. A well gives clean water.</li><li><b>Raw meat and fish</b> carry parasites. Cook them on the fire.</li><li><b>Drying rack</b> turns plants, meat and fish into long-lasting dried food.</li><li><b>Clay pot</b> (fire it first) allows stews and soups, which restore the most.</li></ul>`],
 ['forage','Foraging & plant safety',`<p>Wild plants, flowers and edibles are not labelled. Some are food, some medicine, some poison.</p>
 <ol><li>Pick the plant (${kb32('E')}). Open the Pack (${kb32('I')}).</li><li>Choose <b>Taste (tiny bite)</b>. You learn what it is. A poisonous one will hurt a little, not kill you outright.</li><li>The Journal (${kb32('J')}) records what you know. A plant you learned gets an icon in the world: ☠ ✓ ✚ !</li></ol>
 <p>Characters <b>Mara</b> and <b>Ines</b> can spot suspicious plants and show a yellow ⚠ near them. Ines's medicine is twice as strong.</p>
 <p class="gd-note">Charcoal tonic cures poison. Make it from charcoal and clean water, and keep one in your pack.</p>`],
 ['hunt','Hunting, fishing & combat',`<ul><li><b>Animals</b> behave differently: skittish ones flee, some fight if hurt, predators attack on sight, snakes and spiders strike if you step too close. The Index lists each animal's behaviour, health and damage.</li><li><b>Sneak</b> (${kb32('V')}) makes you quieter. Holding food halves how far animals flee.</li><li><b>Roll</b> (${kb32('G')}) dodges an attack but costs stamina.</li><li><b>Weapons</b>: spear, knife, sword and bow. Higher tiers do more damage. Kade deals 30% more.</li><li><b>Fishing</b>: craft a rod, cast at water, click again at the bite. Fish traps catch while you are away. Wren fishes best.</li><li><b>Skinning</b>: kills drop meat, hides, bones and feathers. Hides become clothes.</li></ul>`],
 ['base','Shelter & building',`<p>Build tab in the Notebook. Everything is placed on a tile in front of you.</p>
 <ul><li><b>Walls, floors, doors, fences</b> in wood or stone. Stone is much stronger.</li><li><b>Bed</b> (or leaf bed) for sleep. <b>Lean-to, tent, hut, cabin, tree house</b> for shelter.</li><li><b>Chest</b> stores items. <b>Workbench, furnace, drying rack</b> are stations.</li><li><b>Well, barrel and filter</b> for water. <b>Fish trap, apiary, trough</b> for food.</li><li><b>Defenses</b>: snare, pitfall, spikes, watchtower.</li></ul>
 <p>Press ${kb32('X')} on a structure to remove it. The Index has the full structure list.</p>`],
 ['farm','Farming & animals',`<ul><li><b>Crops.</b> Hoe the soil, plant a seed, water it. Each crop type prefers a season; the Journal shows the best season for each edible.</li><li><b>Taming.</b> Approach a tameable animal slowly holding food it likes, and feed it. Tame animals follow you and can give eggs or milk.</li><li><b>Breeding.</b> Keep two tame animals of one kind together with food or a trough.</li><li><b>Bees.</b> Place a bee box near flowers, smoke the bees with a torch, harvest honey.</li></ul>`],
 ['explore','Exploring, map & relics',`<ul><li><b>Map</b> (${kb32('M')}): zoom, pan, drop markers, search them, track one on the minimap, toggle layers.</li><li><b>Ruins</b> are old stone walls. Their chests hold curios, and each static map hides ten <b>relics</b> in caches.</li><li><b>Lore pages</b> lie around the world. Collecting all ten tells the story of the wreck.</li><li><b>Wandering Trader</b> arrives every few days. Trade for beads.</li><li><b>Hand-made maps.</b> Ten fixed maps (Emerald Vale and others) can be chosen on the home screen, each with landmarks.</li><li><b>Chronicle</b> mode (home screen) sends you through story chapters on those maps.</li></ul>`],
 ['weather','Time, seasons & weather',`<p>A full day takes about ten minutes of real time. The year has four seasons. Spring blossoms, summer pollen, autumn leaves, winter snow. Seasons change which crops grow and how cold the nights are.</p><ul><li><b>Rain</b> chills you and puts out fires; hold a canteen to collect rainwater.</li><li><b>Storms</b> and <b>fog</b> hide danger. Seek shelter.</li><li><b>Night</b> is dark and cold and predators roam. Carry a torch.</li></ul>`],
 ['touch','Touch controls',`<ul><li><b>Move:</b> a floating joystick appears where you touch on the left side.</li><li><b>Aim:</b> tap or drag on the right side. <b>Act</b>: the big ACT button; hold to keep using.</li><li><b>Quick buttons:</b> roll, eat, sneak, rest. Swipe the hotbar to scroll, double-tap a slot to use it.</li><li><b>Pinch</b> to zoom. Settings → Touch Controls changes layout, left-hand mode, size, aim assist and battery saver.</li></ul>`],
 ['modes','Game modes',`<ul><li><b>Story</b> — ${STORY.length} chapters from first fire to rescue. Needs drain gently.</li><li><b>Survival</b> — full difficulty. One life; death erases the save unless permadeath is switched off.</li><li><b>Sandbox</b> — no needs, everything unlocked, a console on ${kb32('/')}, cheats in the pause menu.</li></ul><p>A <b>world seed</b> (any text or number) makes a world repeatable. The same seed gives the same map.</p><p><b>Item density</b> sets how much is lying around, from Sparse to Overgrown.</p>`],
 ['tips','Pro tips',`<ul><li>Craft a second axe before the first breaks.</li><li>Bring a torch and a bandage on every trip; both are cheap.</li><li>Fill several canteens at once and boil them together.</li><li>Dry a stack of berries on a rack before winter.</li><li>Drop map markers on water, ore, ruins and your base.</li><li>Tame animals pull aggro and give eggs or milk for free food.</li><li>Sleep in a bed; the open ground is colder and slower.</li><li>If something bites you, back away and roll rather than swing.</li><li>The Notebook shows exactly what is missing for each recipe.</li></ul>`],
 ['glossary','Glossary',`<dl class="gd-dl"><dt>Tier</dt><dd>A tool's strength level, 1 (wood) to 5 (steel). A tool can only work materials at or below its tier.</dd><dt>Station</dt><dd>A placed object you must stand near to craft some recipes: campfire, workbench, furnace, rack.</dd><dt>Taste</dt><dd>A tiny bite that reveals a plant's properties at small risk.</dd><dt>Aggro</dt><dd>An animal that has noticed you and is chasing or attacking.</dd><dt>Curio</dt><dd>A collectable keepsake you can sell to the trader.</dd><dt>Relic</dt><dd>One of ten special items hidden in a cache on every fixed map.</dd><dt>Trade Beads</dt><dd>The trader's currency.</dd><dt>Seed</dt><dd>Either a plantable seed item, or the number that makes a world repeatable.</dd><dt>Chronicle</dt><dd>The chapter-based mode on the fixed maps.</dd><dt>Permadeath</dt><dd>On: dying erases the save. Off: you can reload.</dd></dl>`],
 ['faq','Troubleshooting & FAQ',`<h4>I keep getting sick from water</h4><p>Water from lakes, swamps and rivers is dirty. Boil it in the canteen at a lit campfire, or build a well.</p>
 <h4>I cannot chop this tree</h4><p>Hard woods need a higher axe tier. The Index shows each tree's wood hardness.</p>
 <h4>The recipe is greyed out</h4><p>Open it in the Notebook: it lists what is missing, and whether you need to stand at a station. Some recipes also need to be unlocked by finding a specific item.</p>
 <h4>Animals run away</h4><p>Sneak (V) and hold food. Do not run at them.</p>
 <h4>I lost my save</h4><p>Saves are stored in this browser per mode. Clearing site data or using another browser removes them. Survival mode with permadeath erases the save when you die.</p>
 <h4>The game feels heavy on my phone</h4><p>Open Esc → Touch Controls and turn on the battery saver. Atmosphere quality can be set to Low or Off.</p>
 <h4>I have too many items</h4><p>Build a chest. A pack that is too heavy slows you down. Drop or store heavy materials.</p>`],
 ['ladders','Tool tiers & crops',`<h4>Tool tiers</h4><table class="gd-t"><tr><th>Material</th><th>Tier</th><th>Damage ×</th><th>Durability</th></tr>${TIERS.map(t=>`<tr><td>${t[1]}</td><td>${t[2]}</td><td>${t[3]}</td><td>${t[4]}</td></tr>`).join('')}</table>
 <h4>Crops by best season</h4><table class="gd-t"><tr><th>Season</th><th>Crop types</th></tr>${SEASONS.map((n,i)=>`<tr><td>${n}</td><td>${Object.keys(CROP_PREF).filter(k=>CROP_PREF[k]===i).map(k=>EDTYPE[k]).join(', ')||'—'}</td></tr>`).join('')}</table>`]
];

const BIOINFO32=['Open sea. Too deep to wade; swim at your own risk.','Shallow water. Wade or fish. Cold on your feet.','Beach sand: shells, driftwood, crabs and little cover.','Hot desert: little water, cacti, venomous creatures.','Open meadows: flowers, berries, rabbits and deer.','Dense woods: timber, nuts, mushrooms and bigger predators.','Swamp: reeds, frogs, snakes, leeches and dirty water.','Rocky highlands: stone, ore, goats and caves.','Frozen tundra: snow, wolves and bitter cold.'];

function recOut32(r){return ITEMS[r.out[0]]?ITEMS[r.out[0]].name:r.out[0]}
const REVC32=(()=>{let u=null;return()=>{if(u)return u;u={c:{},u:{}};for(const r of RECIPES){const o=r.out[0];(u.c[o]=u.c[o]||[]).push(r);for(const k in r.in)(u.u[k]=u.u[k]||[]).push(r)}return u}})();

  flowers:{name:'Flowers',n:()=>FLOWERS.length,list:()=>FLOWERS.map(p=>({id:p.i,name:p.name,ic:'🌸',sub:bioNames32(p.bio),bio:p.bio,col:p.col}))},
  edibles:{name:'Wild edibles',n:()=>EDIBLES.length,list:()=>EDIBLES.map(p=>({id:p.i,name:p.name,ic:EDICON[p.ty],sub:EDTYPE[p.ty]+' · '+bioNames32(p.bio),bio:p.bio,col:p.col}))},
  trees:{name:'Trees',n:()=>TREES.length,list:()=>TREES.map(p=>({id:p.i,name:p.name,ic:IC32.tree(p),sub:WOODQ[p.hard]+' wood',bio:p.bio,col:p.leaf}))},
  animals:{name:'Animals',n:()=>ANIMALS.length,list:()=>ANIMALS.map(p=>({id:p.i,name:p.name,ic:IC32.an[p.kind]||'🐾',sub:BEH32[p.beh],bio:p.bio,col:p.col}))},
  fish:{name:'Fish',n:()=>FISH.length,list:()=>FISH.map(p=>({id:p.i,name:p.name,ic:'🐟',sub:({s:'Shallows',d:'Deep water',b:'Anywhere'})[p.hab],col:p.col}))},
  structs:{name:'Structures',n:()=>Object.keys(STR).length,list:()=>Object.keys(STR).map(k=>({id:k,name:STR[k].n,ic:'🏗️',sub:STR[k].solid?'Solid':STR[k].floor?'Floor':'Walkable'}))},
  biomes:{name:'Biomes',n:()=>BIOME.length,list:()=>BIOME.map((n,i)=>({id:i,name:n,ic:'🗺️',sub:'',col:BCOL[i]}))},
  chars:{name:'Characters',n:()=>CHARS.length,list:()=>CHARS.map(c=>({id:c.id,name:c.name,ic:'🧍',sub:c.role}))},

['The ash is warm underfoot. Far above the ridge a dark iron lantern waits for a flame. Whoever set ten of them along this road meant them to be lit in order.','Apple-sweet air and the hum of a thousand bees. The Lamplighter passed this way once; the cider house still keeps his boots by the door.','Still water in every direction. Nets hang on the docks as if the fishers had only stepped away. A glass-green lantern shines on the far shore, unlit.','Branches knit overhead. Paths close behind you. Something large keeps pace, just out of sight. Keep your torch burning.','White salt crunches like snow. The ship came here to die; its bones still hold the Lamplighter’s notes.','Cold that bites through wool. Aurora ripples above the trapper’s cabin. The frost lantern needs a flame that will not blow out.','The fen has drowned a cathedral and kept its bells. Light does odd things here. Boil your water and do not trust the shallows.','Wind from every side, and windmills with no sails. The herds follow the river. The lantern of wind is far to the south-west.','Thin air, iron in the walls, and stone needles that vanish into cloud. Smelt your way up; the sky lantern needs a hot forge.','The cape at last. A harbour, a dark lighthouse, and the final lantern on the headland. Light it, and see who answers.'].forEach((t,i)=>CHAP_TXT[10+i]=t);
const PAGES2=[
 ['Day 1 of the road. I have ten iron lanterns and a promise. If a ship ever passes, it must see more than one fire.','The ash here is warm. I left the first lantern high on the ridge where the wind cannot reach it.','A traveller lit it behind me, I think. I saw the glow all night. I do not know who they are.'],
 ['Apples, bees, and a cider house with a roof that holds. I rested three days and almost stayed.','The second lantern is amber glass. The bees do not mind the smoke if you move slowly.','Someone has been leaving fruit by the gate. Not for me, I think. For the next one.'],
 ['The lakes are mirrors. I hung my boots on the dock and fished until dark. Nothing feels urgent here.','Third lantern, green glass. It floats on the water at dusk like a second moon.','I should not linger. The road is long and my hands are getting slow.'],
 ['Thornwood. I kept my axe in my hand for four days and slept in the hollow oak.','Something follows. Wolf, I think. It never attacks, it only watches. Like it knows the lanterns.','Lit the fourth lantern in the briar clearing. The thorns drew back a little. I will not say that to anyone.'],
 ['The salt flats are the loneliest place I have been. The old ship is a gutted hull. I took its rope.','Brine springs to the south-east, drinkable if boiled twice. The fifth lantern is an iron cage of salt crystal.','I found a page in the wreck, written by another hand: "If you are reading this, keep going."'],
 ['Frost. The trapper left his cabin stocked and his stove warm. I am grateful to a man I have never met.','Sixth lantern. The flame has to be shielded or it dies in seconds. I built a stone ring.','Aurora tonight. Green rivers over the pines. I wrote my own name on the wall so the next one knows.'],
 ['The cathedral is drowned to the arches. Bells ring when no one touches them.','Seventh lantern. I lit it by torch from the steps. The water turned the colour of copper.','The fen has taken everything it could. It left me the lantern and, for some reason, the way home.'],
 ['The steppe. Herds as far as I can see. I counted forty before I stopped.','The windmills have no sails but the towers hum like harps. I built a fence and slept inside it.','Eighth lantern lit. The wind put it out twice. The third time it held.'],
 ['The spires. I climbed with torn hands and iron on my back. This is the last wild place on the road.','Ninth lantern, forged iron. It took a furnace and three days of coal to make a flame fit for it.','From the top I saw the sea. A thin glitter, far to the south. The cape.'],
 ['Lantern Cape. The harbour is empty, the lighthouse dark. I am almost there.','If you are reading this, nine lanterns burn behind you. One more.','Light the last one. I will leave the ship a signal bright enough to cross the world.']];

 for(let i=0;i<46;i++){const b=blobs[Math.floor(rnd()*blobs.length)],a=rnd()*6.28,d=Math.sqrt(rnd())*b[2]*.9,x=b[0]+Math.cos(a)*d,y=b[1]+Math.sin(a)*d,up=(y<b[1]-b[2]*.1&&x<b[0]+b[2]*.3);
  c.fillStyle=up?'rgba(255,255,210,.22)':'rgba(0,0,0,.17)';c.beginPath();c.ellipse(x,y,R*.1,R*.065,rnd()*3,0,6.3);c.fill()}
 c.strokeStyle='rgba(255,255,220,.3)';c.lineWidth=LW34*1.1;for(const b of blobs){if(b[1]>blobs[0][1]+R*.5)continue;c.beginPath();c.arc(b[0],b[1],b[2]*.86,Math.PI*1.05,Math.PI*1.55);c.stroke()}}

 if(kind==='banana'){

 if(kind==='cone'||kind==='col'||kind==='redwood'){

  c.fillStyle=lg34(c,-tw/2,0,tw/2,0,sh34(trk,1.2),sh34(trk,.65));c.fillRect(-tw/2,-.4,tw,.4);c.strokeStyle=OLC34;c.lineWidth=LW34;c.strokeRect(-tw/2,-.4,tw,.4);

  if(colm){const w=nm==='Yew'?.34:.26,h=1.5;c.beginPath();c.moveTo(0,-.2-h);c.bezierCurveTo(w*1.1,-.2-h*.7,w*1.15,-.2-h*.2,w*.8,-.18);c.lineTo(-w*.8,-.18);c.bezierCurveTo(-w*1.15,-.2-h*.2,-w*1.1,-.2-h*.7,0,-.2-h);c.closePath();
   c.fillStyle=lg34(c,-w,0,w,0,sh34(leaf,1.25),sh34(leaf,.6),leaf);c.fill();c.strokeStyle='#10200e';c.lineWidth=LW34*1.2;c.stroke();
   c.strokeStyle='rgba(0,0,0,.22)';c.lineWidth=LW34;for(let k=0;k<14;k++){const y=-.28-k*h/15,x=(rnd()-.5)*w*1.3*(1-Math.abs(k/15-.4));c.beginPath();c.arc(x,y,.07,.2,2.9);c.stroke()}

   c.strokeStyle='rgba(0,0,0,.2)';c.lineWidth=LW34;for(let q=0;q<3;q++){c.beginPath();c.moveTo(-wk*.7+q*wk*.55,y0-.04);c.lineTo(-wk*.2+q*wk*.4,y0-hh*.55);c.stroke()}
   if(snow){c.fillStyle='rgba(246,250,255,.92)';c.beginPath();c.moveTo(0,y0-hh);c.lineTo(wk*.62,y0-hh*.42);c.lineTo(wk*.3,y0-hh*.3);c.lineTo(0,y0-hh*.5);c.lineTo(-wk*.35,y0-hh*.3);c.lineTo(-wk*.62,y0-hh*.42);c.closePath();c.fill()}}

  c.strokeStyle='rgba(0,0,0,.25)';for(let k=-2;k<=2;k++){c.beginPath();c.moveTo(k*.1,-.05);c.quadraticCurveTo(k*.13,-.5,k*.08,-.9);c.stroke()}
  const tips=[[-.55,-1.32],[-.25,-1.5],[.15,-1.52],[.5,-1.36],[0,-1.3]];c.strokeStyle=sh34(trk,.8);c.lineWidth=.07;for(const t of tips){c.beginPath();c.moveTo(t[0]*.3,-.95);c.lineTo(t[0],t[1]+.1);c.stroke()}
  crown34(c,tips.map(t=>[t[0],t[1],.2+rnd()*.05]),leaf,.3,rnd);return}
 if(kind==='acacia'){
  c.beginPath();c.moveTo(-.07,0);c.quadraticCurveTo(-.06,-.45,-.22,-.92);c.lineTo(-.14,-.94);c.quadraticCurveTo(0,-.6,.02,-.5);c.quadraticCurveTo(.1,-.7,.22,-.96);c.lineTo(.3,-.92);c.quadraticCurveTo(.1,-.45,.08,0);c.closePath();
  c.fillStyle=lg34(c,-.2,0,.2,0,sh34(trk,1.2),sh34(trk,.62));c.fill();c.strokeStyle=OLC34;c.lineWidth=LW34;c.stroke();
  crown34(c,[[-.42,-1.02,.2],[-.14,-1.1,.24],[.18,-1.12,.24],[.46,-1.04,.2],[0,-.99,.3]].map(b=>[b[0],b[1],b[2]]),leaf,.28,rnd);
  c.fillStyle='rgba(0,0,0,.14)';c.beginPath();c.ellipse(0,-.9,.55,.07,0,0,6.3);c.fill();return}
 if(kind==='weep'){
  trunk34(c,.2,.55,trk,.06);crown34(c,[[0,-.98,.4],[-.3,-.86,.3],[.3,-.86,.3],[0,-1.22,.28]],leaf,.4,rnd);
  for(let k=0;k<14;k++){const x=-.52+k*.08+(rnd()-.5)*.03,top=-.88+Math.abs(k-6.5)*.012,len=.5+rnd()*.25-Math.abs(k-6.5)*.02,sway=(rnd()-.5)*.08;
   c.strokeStyle=sh34(leaf,k%2?1.15:.8);c.lineWidth=.045;c.beginPath();c.moveTo(x,top);c.quadraticCurveTo(x+sway,top+len*.5,x+sway*1.6,top+len);c.stroke()}
  topSnow(0,-1.26,.26,.1);return}
 if(kind==='birch'){
  const w=.12;c.beginPath();c.moveTo(-w*.6,0);c.quadraticCurveTo(-w*.5,-.4,-w*.4,-.92);c.lineTo(w*.4,-.92);c.quadraticCurveTo(w*.5,-.4,w*.6,0);c.closePath();c.fillStyle=lg34(c,-w,0,w,0,'#f4f0e6','#b4b0a4');c.fill();c.strokeStyle=OLC34;c.lineWidth=LW34;c.stroke();
  c.fillStyle='#2a2622';for(let k=0;k<7;k++){c.fillRect(-w*.45+rnd()*w*.4,-.06-k*.12,w*.35+rnd()*w*.3,.022)}
  const R=.27*sz;crown34(c,[[0,-1.12,R],[-R*.85,-.96,R*.72],[R*.85,-.98,R*.72],[-R*.3,-1.38,R*.68],[R*.35,-1.34,R*.66]],leaf,R,rnd);topSnow(0,-1.4,R*.5,.08);return}
 // broadleaf / fruit / wide / tall
 const fruitK=kind==='fruit',wide=kind==='wide',tall=kind==='tall';

 c.strokeStyle=sh34(trk,.85);c.lineWidth=.06;c.beginPath();c.moveTo(0,-.45);c.lineTo(-.16,cy+.08);c.moveTo(0,-.4);c.lineTo(.17,cy+.1);c.stroke();

 const blobs=[[j(),cy+j(),R],[-R*.85*wx+j(),cy+R*.3,R*.78],[R*.85*wx+j(),cy+R*.3,R*.78],[-R*.5*wx,cy-R*.62+j(),R*.72],[R*.5*wx,cy-R*.6+j(),R*.7],[j(),cy+R*.58,R*.68]];
 if(tall)blobs.push([j(),cy-R*1.1,R*.62]);if(wide)blobs.push([-R*1.45,cy+R*.5,R*.5],[R*1.45,cy+R*.5,R*.5]);

const _dt34=drawTree;
drawTree=function(o,cx,by){
 if(SP34.style!=='new'||o.st)return _dt34(o,cx,by);
 const T=TREES[o.t],nm=T.name,conif=CONE.has(nm)||PALM.has(nm),leaf=seasonCol(T.leaf,conif),v=Math.floor(hash2(o.x,o.y,5)*3),fr=T.fruit&&!o.d?1:0;
 const sz=.9+.07*T.hard,occl=P.y<o.y+.6&&P.y>o.y-1.7&&Math.abs(P.x-(o.x+.5))<.95;
 shadow(cx,by,TS*.4*sz,TS*.12);
 if(QL!=='low'){const h=hourNow();if(h>6&&h<18){const sa=(h-6)/12,len=1.1-Math.sin(sa*Math.PI)*.55,dx=-Math.cos(sa*Math.PI)*len*TS*.9,al=.2*(1-nightAmt())*(G.raining?.5:1);ctx.save();ctx.fillStyle='rgba(10,24,10,'+al.toFixed(3)+')';ctx.beginPath();ctx.ellipse(cx+dx*.5,by+TS*.04,TS*.34+Math.abs(dx)*.5,TS*.11,0,0,6.3);ctx.fill();ctx.restore()}}
 const e=sc34('tr|'+o.t+'|'+v+'|'+SN+'|'+fr,2.8,3.4,1.4,3.1,c=>tree34(c,T,leaf,nm,v,fr));
 if(occl)ctx.globalAlpha=.55;blit34(e,cx,by);
 if(o.hive){ctx.fillStyle='#8a5a2a';ctx.beginPath();ctx.ellipse(cx+TS*.22,by-TS*.6,TS*.08,TS*.13,0,0,6.3);ctx.fill();ctx.strokeStyle=OL;ctx.lineWidth=1;ctx.stroke();ctx.fillStyle='#e8b82a';ctx.fillRect(cx+TS*.2+Math.sin(T0*9)*3,by-TS*.7+Math.cos(T0*7)*3,2,2)}
 ctx.globalAlpha=1};

function rock34(c,sub,v,h){
 const rnd=rng34(v*13+strHash34(sub)),base=sub==='stone'?'#8e8e92':sub==='coal'?'#5a5a60':sub==='copper'?'#85807a':sub==='iron'?'#7e7872':'#7c8088';
 const n=8,pts=[];for(let k=0;k<n;k++){const a=k/n*6.283+rnd()*.25,r=.36+.1*rnd();pts.push([Math.cos(a)*r*1.15,Math.sin(a)*r*.82])}
 const poly=(ps,f)=>{c.beginPath();ps.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();c.fillStyle=f;c.fill()};
 poly(pts,base);c.strokeStyle=OLC34;c.lineWidth=LW34*1.2;c.stroke();
 const top=pts.filter(p=>p[1]<.02),right=pts.filter(p=>p[0]>.02&&p[1]>-.1);
 poly([[0,.02],...top.sort((a,b)=>a[0]-b[0])],sh34(base,1.28));poly([[0,.02],...right.sort((a,b)=>a[1]-b[1])],sh34(base,.74));
 c.strokeStyle='rgba(0,0,0,.25)';c.lineWidth=LW34*.8;c.beginPath();c.moveTo(-.2,-.08);c.lineTo(0,.02);c.lineTo(.18,.3);c.moveTo(0,.02);c.lineTo(.28,-.15);c.stroke();
 c.fillStyle='rgba(255,255,255,.28)';c.beginPath();c.ellipse(-.13,-.17,.12,.05,-.5,0,6.3);c.fill();
 if(SN===3){c.fillStyle='rgba(248,252,255,.92)';c.beginPath();c.ellipse(-.02,-.16,.3,.1,0,Math.PI,0);c.fill()}
 else if(sub==='stone'&&rnd()<.55&&SN!==2){c.fillStyle='rgba(80,130,50,.7)';c.beginPath();c.ellipse(-.12+rnd()*.1,-.2,.12,.045,0,0,6.3);c.ellipse(.15,.04,.07,.03,0,0,6.3);c.fill()}
 const ore={coal:['#14141a','#4a4a56'],copper:['#d8883a','#5ec8a0'],iron:['#a0502a','#c87848']}[sub];
 if(ore){for(let k=0;k<6;k++){const x=(rnd()-.5)*.55,y=(rnd()-.5)*.34;c.fillStyle=ore[0];c.beginPath();c.moveTo(x-.045,y+.03);c.lineTo(x,y-.05);c.lineTo(x+.05,y+.025);c.closePath();c.fill();c.strokeStyle='rgba(0,0,0,.5)';c.lineWidth=LW34*.6;c.stroke();c.fillStyle=ore[1];c.fillRect(x-.012,y-.03,.02,.02)}}
 if(sub==='gem'){const cols=['#6ae8e8','#9af4f0','#4cc4d8'];for(let k=0;k<3;k++){const x=-.12+k*.13,hh=.2+rnd()*.12,w=.055;c.beginPath();c.moveTo(x-w,-.1);c.lineTo(x-w*.7,-.1-hh*.7);c.lineTo(x,-.1-hh);c.lineTo(x+w*.7,-.1-hh*.7);c.lineTo(x+w,-.1);c.closePath();c.fillStyle=cols[k];c.fill();c.strokeStyle='#1c5a68';c.lineWidth=LW34*.8;c.stroke();c.fillStyle='rgba(255,255,255,.55)';c.beginPath();c.moveTo(x-w*.6,-.12);c.lineTo(x-w*.4,-.1-hh*.7);c.lineTo(x,-.1-hh*.9);c.lineTo(x-w*.1,-.12);c.fill()}}
}

function csSold(price){const F=FS();F.gold+=price;F.sold=true;F.soldPrice=price;saveGame(true);
 csPlay([{sc:'sold',d:9,text:'You shake hands, pack your things, and walk the road one last time. Behind you, the farm grows small.'},{sc:'sold',d:8,text:'Years from now, the valley will still tell stories of the farmer who made the soil sing.',o:{}},{sc:'sold',d:7,text:'THE END — '+yearNo()+' year(s) of farming, '+money(F.earned)+' in sales, mine floor '+(F.maxDepth|0)+', '+Object.keys(F.met).length+' friends made.',o:{}}],()=>{
  dlg40('EPILOGUE',`<p>You sold the farm for <b>${price.toLocaleString()}g</b>.</p><p>${yearNo()} year(s), ${money(F.earned)} in sales, ${F.maxDepth|0} mine floors, ${Object.keys(F.met).length} friends. Thank you for playing Homestead Valley.</p>`,
  [{t:'Return to title',fn:()=>{saveGame(true);location.reload()}},{t:'Keep wandering as a visitor'}])})}
if(typeof screen!=='undefined'&&screen==='title')showTitle();

// quest panel for the farm: next goals
const _rq41=refreshQuest;refreshQuest=function(){if(!G||G.mode!=='farm'||!G.farm){return _rq41.apply(null,arguments)}
 const q=$('quest');if(!q)return;const open=FGOALS.filter(g=>!G.farm.goals[g[0]]).slice(0,4);
 q.innerHTML='<h4>Farm goals ('+Object.keys(G.farm.goals).length+'/'+FGOALS.length+')</h4>'+(open.length?open.map(g=>'• '+g[1]).join('<br>'):'All goals done. Farm forever, or hear the offer.')+'<div style="color:var(--dim);margin-top:4px;font-size:11px">[G] Journal</div>'};
const _hu41=hudUpdate;let q41=0;hudUpdate=function(){_hu41();if(G&&G.mode==='farm'){q41+=.1;if(q41>1.5){q41=0;refreshQuest()}}};
if(typeof screen!=='undefined'&&screen==='title')showTitle();
// ---- farm dropdown right inside the Homestead Valley card (desktop and mobile start page)
function farmSelHTML(){if(ui.farm==null)ui.farm=1;return `<select class="farmSel2" style="display:block;width:100%;margin-top:8px;padding:8px;background:#0b0e09;color:var(--ink,#e8e8d0);border:2px solid var(--accent,#e8c060);font-size:14px">${FARMS40.map((f,i)=>`<option value="${i+1}" ${ui.farm===i+1?'selected':''}>${i+1}. ${f[0]}</option>`).join('')}</select><span class="farmDesc2" style="display:block;margin-top:4px;font-size:12px;color:var(--dim,#9a9a80)">${FARMS40[ui.farm-1][1]}</span>`}
function addFarmSel(){document.querySelectorAll('[data-mode=farm],[data-mm=farm]').forEach(c=>{if(c.querySelector('.farmSel2'))return;const host=c.querySelector('div:last-child')&&c.dataset.mm?c.querySelector('div'):c;const w=document.createElement('div');w.innerHTML=farmSelHTML();host.appendChild(w)})}
const _st42=showTitle;showTitle=function(){_st42();addFarmSel()};
if(typeof mobRender==='function'){const _mr42=mobRender;mobRender=function(){const r=_mr42.apply(null,arguments);addFarmSel();return r}}
['click','mousedown','touchstart','pointerdown'].forEach(ev=>document.addEventListener(ev,e=>{if(e.target.classList&&e.target.classList.contains('farmSel2'))e.stopPropagation()},true));
document.addEventListener('change',e=>{if(e.target.classList&&e.target.classList.contains('farmSel2')){ui.farm=+e.target.value;const wasFarm=ui.mode==='farm';ui.mode='farm';
 const mh=document.getElementById('mhome');if(mh&&typeof mobRender==='function'){mobRender()}else{showTitle()}}});
if(typeof screen!=='undefined'&&screen==='title')showTitle();

</script>
</body></html>
